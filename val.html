<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Pro můj kebábek 💖</title>
<style>
body, html {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  font-family: 'Comic Sans MS', cursive;
  background: #ffc0cb; /* růžové pozadí */
  text-align: center;
  color: white;
}

.content {
  position: relative;
  z-index: 2;
  margin-top: 12%;
}

h1 {
  font-size: 42px;
  text-shadow: 2px 2px 10px black;
}

button {
  padding: 15px 30px;
  font-size: 22px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  margin: 15px;
  transition: 0.2s;
}

#yesBtn {
  background: #ff1493;
  color: white;
  position: relative;
  animation: heartbeat 1s infinite;
}

#noBtn {
  background: white;
  color: #ff1493;
  position: absolute;
}

.floating {
  position: absolute;
  font-size: 30px;
  animation: float 10s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.2); }
  50% { transform: scale(1); }
  75% { transform: scale(1.2); }
}

@keyframes bigHeartbeat {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.5); }
  50% { transform: scale(1); }
  75% { transform: scale(1.5); }
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background-color: hsl(var(--hue), 80%, 60%);
  opacity: 0.9;
  border-radius: 50%;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1;}
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0;}
}
</style>
</head>

<body>

<div class="content" id="mainContent">
  <h1 id="question">Můj malý kebábku budeš můj Vatentýn? 💖</h1>
  <button id="yesBtn">ANO 💘</button>
  <button id="noBtn">NE 😏</button>
</div>

<!-- Hudba od Elvise -->
<audio id="music" autoplay loop>
  <source src="elvis.mp3" type="audio/mp3">
</audio>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const question = document.getElementById("question");
const mainContent = document.getElementById("mainContent");

// Inicialní pozice NE v okolí ANO
function setNoInitialPosition() {
  const yesRect = yesBtn.getBoundingClientRect();
  noBtn.style.left = (yesRect.left + yesRect.width + 20) + "px"; 
  noBtn.style.top = yesRect.top + "px";
}
setNoInitialPosition();

// Funkce pro NE – mizí, znovu se objeví, mění velikost a lehce „uteče“ kolem ANO
function moveNo(mouseX, mouseY) {
  const rectNo = noBtn.getBoundingClientRect();
  const centerX = rectNo.left + rectNo.width/2;
  const centerY = rectNo.top + rectNo.height/2;

  const dx = mouseX - centerX;
  const dy = mouseY - centerY;
  const distance = Math.sqrt(dx*dx + dy*dy);

  if(distance < 100){ // když je kurzor blízko
    const yesRect = yesBtn.getBoundingClientRect();

    let newX = rectNo.left + (Math.random()*80 - 40); // ±40px
    let newY = rectNo.top + (Math.random()*80 - 40);

    // omezení kolem ANO
    const minX = yesRect.left - 50;
    const maxX = yesRect.right + 50 - rectNo.width;
    const minY = yesRect.top - 50;
    const maxY = yesRect.bottom + 50 - rectNo.height;

    newX = Math.max(minX, Math.min(newX, maxX));
    newY = Math.max(minY, Math.min(newY, maxY));

    noBtn.style.left = newX + "px";
    noBtn.style.top = newY + "px";

    // náhodně zmizí a objeví se
    if(Math.random() > 0.5){
      noBtn.style.opacity = "0";
      setTimeout(()=>{ noBtn.style.opacity = "1"; }, 400);
    }

    // náhodně zmenšit/zvětšit
    const scale = Math.random() * 0.5 + 0.75;
    noBtn.style.transform = `scale(${scale})`;
  }
}

// Sledování pohybu myši
document.addEventListener("mousemove", e => moveNo(e.clientX, e.clientY));

// Po 2 minutách NE zmizí a ANO začne tlouct výrazněji
setTimeout(()=>{
  if(document.body.contains(noBtn)) noBtn.remove();
  yesBtn.style.animation = "heartbeat 1s infinite";
}, 2*60*1000);

// Kliknutí ANO – zmizí tlačítka a otázka, hudba pokračuje, tlukoucí velké srdce
yesBtn.addEventListener("click", ()=>{
  // odstraníme obsah s tlačítky a otázkou
  mainContent.style.display = "none";

  // vytvoříme velký text gratulace
  const congrats = document.createElement("h1");
  congrats.textContent = "YES! Uhnala jsem baddie 💖";
  congrats.style.marginTop = "20%";
  congrats.style.fontSize = "55px";
  congrats.style.color = "white";
  congrats.style.textShadow = "2px 2px 10px black";
  congrats.style.animation = "bigHeartbeat 1s infinite";
  document.body.appendChild(congrats);

  // konfety
  for(let i=0;i<150;i++){
    const c = document.createElement("div");
    c.classList.add("confetti");
    c.style.left = Math.random()*100 + "vw";
    c.style.backgroundColor = `hsl(${Math.random()*360},80%,60%)`;
    c.style.animationDuration = (Math.random()*3+2) + "s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }

  // ohňostroj
  for(let i=0;i<20;i++){
    const f = document.createElement("div");
    f.style.position = "absolute";
    f.style.left = Math.random()*window.innerWidth + "px";
    f.style.top = Math.random()*window.innerHeight/2 + "px";
    f.style.width = "10px";
    f.style.height = "10px";
    f.style.backgroundColor = `hsl(${Math.random()*360},80%,60%)`;
    f.style.borderRadius = "50%";
    f.style.opacity = 1;
    f.style.transition = "all 1s linear";
    document.body.appendChild(f);
    setTimeout(()=>{f.style.width="50px"; f.style.height="50px"; f.style.opacity=0;},50);
    setTimeout(()=>f.remove(),1200);
  }
});

// létající kebaby, RedBully a lilie
function createFloatingItem(){
  const items = ["🌯","🥤","💐"];
  const el = document.createElement("div");
  el.classList.add("floating");
  el.innerText = items[Math.floor(Math.random()*items.length)];
  el.style.left = Math.random()*100 + "vw";
  el.style.fontSize = (Math.random()*20 + 25) + "px";
  el.style.animationDuration = (Math.random()*5 + 5) + "s";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),10000);
}
setInterval(createFloatingItem, 800);

</script>
</body>
</html>
